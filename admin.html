<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Leads</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e7;
      --card: #ffffff;
      --ink: #15141c;
      --muted: #6f6b7a;
      --accent: #6f4ff2;
      --border: #e7dfd0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 40px -24px rgba(21, 20, 28, 0.25);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      background: #fcfaf5;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .header button {
      border: none;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .table-wrap {
      padding: 20px 28px 28px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #efe7ff;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .agent-select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fdfbf7;
      font-size: 0.85rem;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
    }

    .call-btn {
      border: none;
      background: var(--ink);
      color: var(--bg);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    .call-btn:hover {
      background: var(--accent);
    }
    .call-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="header">
        <h1>Available Agents</h1>
        <button id="refreshAgentsBtn" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table id="agentsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Type</th>
              <th>Status</th>
              <th>Language</th>
              <th>Model</th>
            </tr>
          </thead>
          <tbody id="agentsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" style="margin-top: 28px;">
      <div class="header">
        <h1>Lead Admin Panel - Assign Agent & Call</h1>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table id="leadsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Course</th>
              <th>Assign Agent</th>
              <th>Action</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" style="margin-top: 28px;">
      <div class="header">
        <h1>Snapserve Call Summaries & Details</h1>
        <button id="refreshCallsBtn" type="button">Refresh Calls</button>
      </div>
      <div class="table-wrap">
        <table id="callsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Agent</th>
              <th>Phone</th>
              <th>Duration</th>
              <th>Status</th>
              <th>Summary</th>
              <th>Transcript</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="callsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const agentsBody = document.getElementById('agentsBody');
    const refreshAgentsBtn = document.getElementById('refreshAgentsBtn');
    const leadsBody = document.getElementById('leadsBody');
    const refreshBtn = document.getElementById('refreshBtn');
    const callsBody = document.getElementById('callsBody');
    const refreshCallsBtn = document.getElementById('refreshCallsBtn');

    let availableAgents = [];

    async function loadAgents() {
      agentsBody.innerHTML = '<tr><td colspan="6" class="empty">Loading agents…</td></tr>';

      try {
        const response = await fetch('/agents');
        if (!response.ok) {
          throw new Error('Unable to load agents');
        }

        const agents = await response.json();
        availableAgents = Array.isArray(agents) ? agents : [];

        if (!availableAgents.length) {
          agentsBody.innerHTML = '<tr><td colspan="6" class="empty">No agents available.</td></tr>';
          return;
        }

        agentsBody.innerHTML = availableAgents.map((agent) => `
          <tr>
            <td>#${agent.id}</td>
            <td>${agent.name || '—'}</td>
            <td>${agent.agentType || '—'}</td>
            <td><span class="badge">${agent.status || 'unknown'}</span></td>
            <td>${agent.language || '—'}</td>
            <td>${agent.llmModel || '—'}</td>
          </tr>
        `).join('');

        // Reload leads to populate agent options in leads table
        loadLeads();
      } catch (error) {
        agentsBody.innerHTML = `<tr><td colspan="6" class="empty">${error.message}</td></tr>`;
      }
    }

    async function loadLeads() {
      leadsBody.innerHTML = '<tr><td colspan="8" class="empty">Loading leads…</td></tr>';

      try {
        const response = await fetch('/leads');
        if (!response.ok) {
          throw new Error('Unable to load leads');
        }

        const leads = await response.json();
        if (!leads.length) {
          leadsBody.innerHTML = '<tr><td colspan="8" class="empty">No leads have been submitted yet.</td></tr>';
          return;
        }

        leadsBody.innerHTML = leads.map((lead) => {
          const agentOptionsHtml = availableAgents.length > 0
            ? availableAgents.map(a => `
                <option value="${a.id}" ${String(lead.agent) === String(a.id) ? 'selected' : ''}>
                  ${a.name ? `${a.name} (#${a.id})` : `Agent #${a.id}`}
                </option>
              `).join('')
            : `<option value="${lead.agent || ''}">${lead.agent ? `Agent #${lead.agent}` : 'Select Agent'}</option>`;

          return `
            <tr>
              <td>#${lead.id}</td>
              <td>${lead.name || '—'}</td>
              <td>${lead.email || '—'}</td>
              <td>${lead.phone || '—'}</td>
              <td>${lead.course ? `<span class="badge">${lead.course}</span>` : '—'}</td>
              <td>
                <select id="agent-select-${lead.id}" class="agent-select">
                  <option value="">Choose Agent</option>
                  ${agentOptionsHtml}
                </select>
              </td>
              <td>
                <button class="call-btn" id="call-btn-${lead.id}" type="button" onclick="triggerCallForLead(${lead.id}, '${lead.phone}')">
                  📞 Call Student
                </button>
              </td>
              <td>${lead.created_at ? new Date(lead.created_at).toLocaleString() : '—'}</td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        leadsBody.innerHTML = `<tr><td colspan="8" class="empty">${error.message}</td></tr>`;
      }
    }

    async function triggerCallForLead(leadId, phone) {
      const select = document.getElementById(`agent-select-${leadId}`);
      const callBtn = document.getElementById(`call-btn-${leadId}`);
      const agentId = select ? select.value : '';

      if (!agentId) {
        alert('Please select an agent from the dropdown first.');
        return;
      }

      callBtn.disabled = true;
      callBtn.textContent = 'Calling…';

      try {
        const response = await fetch('/call-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ leadId, agentId, phone })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Failed to initiate call');
        }

        callBtn.textContent = 'Call Placed ✓';
        setTimeout(() => {
          callBtn.disabled = false;
          callBtn.textContent = '📞 Call Student';
        }, 3000);

        // Refresh call logs
        loadCalls();
      } catch (err) {
        alert('Error initiating call: ' + err.message);
        callBtn.disabled = false;
        callBtn.textContent = '📞 Call Student';
      }
    }

    async function loadCalls() {
      callsBody.innerHTML = '<tr><td colspan="8" class="empty">Loading call records…</td></tr>';

      try {
        const response = await fetch('/calls');
        if (!response.ok) {
          throw new Error('Unable to load call logs');
        }

        const calls = await response.json();
        if (!calls.length) {
          callsBody.innerHTML = '<tr><td colspan="8" class="empty">No call records recorded yet.</td></tr>';
          return;
        }

        callsBody.innerHTML = calls.map((call) => `
          <tr>
            <td>#${call.id}</td>
            <td>${call.agent_name || call.agent_id ? `<span class="badge">${call.agent_name || call.agent_id}</span>` : '—'}</td>
            <td>${call.phone || '—'}</td>
            <td>${call.duration ? call.duration + 's' : '0s'}</td>
            <td><span class="badge" style="background:${call.status === 'completed' ? '#e2f9e1' : '#ffe7e7'}; color:${call.status === 'completed' ? '#1f7a1e' : '#c52828'};">${call.status || 'unknown'}</span></td>
            <td style="max-width: 250px; font-size: 0.9rem;">${call.summary || '—'}</td>
            <td style="max-width: 250px;">
              ${call.transcript ? `
                <details>
                  <summary style="cursor:pointer; color:var(--accent); font-weight:600; font-size:0.85rem;">View Transcript</summary>
                  <pre style="white-space:pre-wrap; font-size:0.8rem; background:#f5f3ff; padding:8px; border-radius:6px; margin-top:6px; max-height:150px; overflow-y:auto;">${call.transcript}</pre>
                </details>
              ` : '—'}
            </td>
            <td style="font-size:0.85rem;">${call.created_at ? new Date(call.created_at).toLocaleString() : '—'}</td>
          </tr>
        `).join('');
      } catch (error) {
        callsBody.innerHTML = `<tr><td colspan="8" class="empty">${error.message}</td></tr>`;
      }
    }

    refreshAgentsBtn.addEventListener('click', loadAgents);
    refreshBtn.addEventListener('click', loadLeads);
    refreshCallsBtn.addEventListener('click', loadCalls);

    loadAgents();
    loadCalls();
  </script>
</body>
</html>
